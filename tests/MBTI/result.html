<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的结果 · MBTI 人格罗盘</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="wrap nav">
    <a class="nav__brand" href="index.html">
      <svg class="nav__logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#f59e42"/></linearGradient>
          <linearGradient id="c2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34b37e"/><stop offset="1" stop-color="#b564d8"/></linearGradient>
        </defs>
        <rect width="64" height="64" rx="18" fill="url(#c1)"/>
        <circle cx="32" cy="32" r="17" fill="none" stroke="url(#c2)" stroke-width="7" stroke-dasharray="26.7 80" transform="rotate(90 32 32)"/>
        <circle cx="32" cy="32" r="17" fill="none" stroke="url(#c1)" stroke-width="7" stroke-dasharray="26.7 80" transform="rotate(270 32 32)"/>
        <circle cx="32" cy="32" r="8" fill="#fff"/>
        <text x="32" y="36" text-anchor="middle" font-family="serif" font-size="10" fill="#16203a" font-weight="700">罗盘</text>
      </svg>
      <span>MBTI<small>人格罗盘</small></span>
    </a>
    <nav class="nav__right" aria-label="主导航">
      <a class="nav__link back-link" href="../index.html" title="返回测试区">← 返回</a>
      <span id="themeToggle"></span>
      <a class="nav__link" href="index.html">首页</a>
      <a class="nav__link" href="test.html" id="navRetake">重新测试</a>
    </nav>
  </header>

  <main id="resultApp">
    <!-- 由 JS 渲染 -->
  </main>

  <footer class="footer wrap">
    <p style="color:var(--text-2);font-size:14px;">MBTI 人格罗盘 · 仅供自我探索，不构成心理诊断</p>
    <p class="legal">题型与评分参照 16personalities.com · 题文为本地中文版本</p>
  </footer>

</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const KEEP_KEY = 'mbti_done_v1';
  const SAVE_KEY = 'mbti_answers_v1';

  const app = document.getElementById('resultApp');
  if (!app) return;

  let result = null;
  try {
    const raw = localStorage.getItem(KEEP_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && obj.pct && obj.code) result = obj;
    }
  } catch (e) { /* ignore */ }

  if (!result) {
    app.innerHTML =
      '<div class="wrap card fade-in" style="max-width:620px;margin:90px auto;text-align:center;padding:50px;">' +
        '<p class="tag" style="justify-content:center;">还没有结果</p>' +
        '<h2 class="h2" style="margin:16px 0 10px;">先完成一次测试，才能看到你的罗盘。</h2>' +
        '<p class="lede" style="font-size:15px;margin-bottom:28px;">大约需要 12 分钟，作答会保存在本机。</p>' +
        '<a class="btn" href="test.html">开始测试</a>' +
      '</div>';
    return;
  }

  const pct = result.pct;
  const code = result.code;
  const type = TYPES[code];
  const group = GROUPS[type.group];
  const pairs = pairPct(pct);
  const identityPct = pct.identity;
  const identityDominant = identityPct >= 50 ? '自信' : '谨慎';
  const identityCode = identityPct >= 50 ? 'A' : 'T';
  const identityDesc =
    identityPct >= 50
      ? '你倾向于自信（Assertive），相信自己能掌控局面，不轻易为外界评价所动摇。自信者往往更稳定从容，但也要留意是否忽略了他人的反馈。'
      : '你倾向于谨慎（Turbulent），对细节与潜在风险敏感，也因此更容易内省、追求成长。谨慎者往往自我要求高，需要学习自我接纳。';

  function gColor(grp) { return GROUPS[grp].color; }
  const dimColor = ['var(--dim-mind)', 'var(--dim-energy)', 'var(--dim-nature)', 'var(--dim-tactics)'];
  const dimLabel = ['思维 Mind', '能量 Energy', '天性 Nature', '策略 Tactics'];

  const codeLetters = code.split('').map(function (l, i) {
    return '<span style="animation-delay:' + (i * 0.12) + 's">' + l + '</span>';
  }).join('');

  /* ---- 维度条形图（渐变 + 百分比标注）---- */
  const barsHtml = pairs.map(function (p, i) {
    const pctLeft = p.aWins ? p.aPct : p.bPct;
    const pctRight = 100 - pctLeft;
    const leftColor = p.aWins ? dimColor[i] : 'rgba(139,149,168,.7)';
    const rightColor = p.aWins ? 'rgba(139,149,168,.7)' : dimColor[i];
    return (
      '<div class="bar-row">' +
        '<span class="bar-row__code' + (p.aWins ? '' : ' muted') + '">' + p.codeA + '</span>' +
        '<div class="bar-track" data-w="' + pctLeft + '">' +
          '<span class="bar-mid"></span>' +
          '<span class="bar-fill bar-fill--left" style="--bar-c:' + dimColor[i] + ';width:0%">' +
            '<span class="bar-pct-chip bar-pct-chip--left">' + pctLeft + '%</span>' +
          '</span>' +
          '<span class="bar-fill bar-fill--right" style="--bar-c2:rgba(139,149,168,.75);width:0%">' +
            '<span class="bar-pct-chip bar-pct-chip--right">' + pctRight + '%</span>' +
          '</span>' +
        '</div>' +
        '<span class="bar-row__code' + (p.aWins ? ' muted' : '') + '">' + p.codeB + '</span>' +
      '</div>'
    );
  }).join('');

  /* ---- 身份维度 ---- */
  const identRight = 100 - identityPct;
  const identHtml =
    '<div class="bar-row identity-bar">' +
      '<span class="bar-row__code' + (identityPct >= 50 ? '' : ' muted') + '">A</span>' +
      '<div class="bar-track" data-w="' + identityPct + '">' +
        '<span class="bar-mid"></span>' +
        '<span class="bar-fill bar-fill--left" style="--bar-c:var(--brand);width:0%">' +
          '<span class="bar-pct-chip bar-pct-chip--left">' + identityPct + '%</span>' +
        '</span>' +
        '<span class="bar-fill bar-fill--right" style="--bar-c2:var(--text-3);width:0%">' +
          '<span class="bar-pct-chip bar-pct-chip--right">' + identRight + '%</span>' +
        '</span>' +
      '</div>' +
      '<span class="bar-row__code' + (identityPct >= 50 ? ' muted' : '') + '">T</span>' +
    '</div>' +
    '<p class="lede" style="font-size:15px;max-width:40em;margin:12px auto 0;">' + identityDesc + '</p>';

  /* ---- 四维比例卡 ---- */
  const ratioGrid = pairs.map(function (p, i) {
    const dom = p.dominant;
    const domPct = p.aWins ? p.aPct : p.bPct;
    return (
      '<div class="dim-ratio">' +
        '<div class="dim-ratio__head">' +
          '<span class="dim-ratio__name">' + dimLabel[i] + '</span>' +
          '<span class="dim-ratio__codes" style="color:' + dimColor[i] + '">' + p.codeA + ' · ' + p.codeB + '</span>' +
        '</div>' +
        '<div class="dim-ratio__bar"><div class="dim-ratio__fill" style="--ratio-c:' + dimColor[i] + ';width:0%" data-w="' + domPct + '"></div></div>' +
        '<div class="dim-ratio__pct">' +
          '<span><b>' + p.aPct + '%</b> ' + p.labelA + ' ' + p.codeA + '</span>' +
          '<span>' + p.labelB + ' ' + p.codeB + ' <b>' + p.bPct + '%</b></span>' +
        '</div>' +
        '<div style="margin-top:10px;font-size:13px;color:var(--text-2);">倾向：<b style="color:' + dimColor[i] + '">' + p.dominant + '（' + strengthLabel(domPct) + '）</b></div>' +
      '</div>'
    );
  }).join('');

  /* ---- 气质群组分析 ---- */
  const groupHtml =
    '<div class="group-analysis">' +
      '<h3><span class="sw" style="background:' + gColor(type.group) + '"></span>' + group.name + ' · ' + group.en + '</h3>' +
      '<p>' + group.full + '</p>' +
      '<div class="tags">' +
        group.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') +
      '</div>' +
    '</div>';

  /* ---- 认知功能栈 ---- */
  const funcRoles = { 主导: 0, 辅助: 1, 第三: 2, 劣势: 3 };
  const funcHtml =
    '<section class="funcs">' +
      '<h2 class="h2">认知功能栈</h2>' +
      '<p class="sub">荣格认知功能解释你「如何思考与感知」。以下四种功能按使用频率从高到低排列。</p>' +
      '<div class="func-grid">' +
        (type.func || []).map(function (f, i) {
          return (
            '<div class="func-card func--' + i + '">' +
              '<div class="func-card__role">' + f.role + '</div>' +
              '<div class="func-card__head">' +
                '<span class="func-card__k">' + f.k + '</span>' +
                '<span class="func-card__name">' + f.name + '</span>' +
              '</div>' +
              '<p class="func-card__d">' + f.d + '</p>' +
            '</div>'
          );
        }).join('') +
      '</div>' +
    '</section>';

  /* ---- 类型墙 ---- */
  const wallHtml = Object.keys(TYPES).map(function (k) {
    const t = TYPES[k];
    const gc = GROUPS[t.group].color;
    return (
      '<div class="wall-card' + (k === code ? ' active' : '') + '" style="--wall-c:' + gc + '">' +
        '<div class="topline" style="background:' + gc + '"></div>' +
        '<code>' + k + '</code>' +
        '<div class="nm">' + t.name + '</div>' +
      '</div>'
    );
  }).join('');

  const html =
    '<div class="wrap">' +

      /* ---- 头部 ---- */
      '<section class="result-head fade-in">' +
        '<p class="tag" style="justify-content:center;">你的结果</p>' +
        '<div class="code">' + codeLetters + '</div>' +
        '<div class="type-name">' + type.name + ' ' + type.en + '</div>' +
        '<div class="type-en">' + type.trait + '</div>' +
        '<div class="group-banner" style="border-color:' + gColor(type.group) + '66;background:color-mix(in srgb,' + gColor(type.group) + ' 12%, transparent);">' +
          '<span class="group-banner__sw" style="background:' + gColor(type.group) + '"></span>' +
          '<span>' +
            '<span class="group-banner__t" style="color:var(--text);">' + group.name + ' · ' + group.en + '</span>' +
            '<span class="group-banner__d">' + group.desc + '</span>' +
          '</span>' +
        '</div>' +
      '</section>' +

      /* ---- 维度条形图 ---- */
      '<section class="bars">' +
        '<h2 class="h2">你的四维倾向</h2>' +
        '<p class="sub">百分比越接近 100%，表示越偏向对应一侧；越接近 50%，表示两者越均衡。</p>' +
        barsHtml +
      '</section>' +

      /* ---- 身份维度 ---- */
      '<section class="identity-sec">' +
        '<h3 class="h3">身份特质 — ' + identityDominant + '（' + identityCode + '）</h3>' +
        identHtml +
      '</section>' +

      /* ---- 四维比例卡 ---- */
      '<section class="bars" style="margin-top:40px;">' +
        '<h2 class="h2">四维深度解读</h2>' +
        '<p class="sub">把百分比拆开看，你的每一个维度有多鲜明。</p>' +
        '<div class="dim-ratio-grid">' + ratioGrid + '</div>' +
      '</section>' +

      /* ---- 认知功能栈 ---- */
      funcHtml +

      /* ---- 类型简介 ---- */
      '<section class="profile">' +
        '<h2 class="h2">关于 ' + type.name + '（' + code + '）</h2>' +
        '<div class="desc-card">' +
          '<p><b>' + type.trait + '。</b>' + type.long + '</p>' +
        '</div>' +

        '<div class="detail-grid">' +
          '<div class="detail"><div class="detail__k">核心特质</div><div class="detail__v">' + type.trait + '</div></div>' +
          '<div class="detail"><div class="detail__k">优势</div><div class="detail__v">' + type.strength + '</div></div>' +
          '<div class="detail"><div class="detail__k">需要注意</div><div class="detail__v">' + type.weak + '</div></div>' +
          '<div class="detail"><div class="detail__k">适合的职业方向</div><div class="detail__v">' + type.career + '</div></div>' +
          '<div class="detail"><div class="detail__k">亲密关系</div><div class="detail__v">' + type.love + '</div></div>' +
          '<div class="detail"><div class="detail__k">成长建议</div><div class="detail__v">' + type.growth + '</div></div>' +
        '</div>' +

        '<div class="group-analysis">' +
          '<h3><span class="sw" style="background:' + gColor(type.group) + '"></span>' + group.name + ' · ' + group.en + ' 的气质</h3>' +
          '<p>' + group.full + '</p>' +
          '<div class="tags">' +
            group.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('') +
          '</div>' +
        '</div>' +
      '</section>' +

      /* ---- 类型墙 ---- */
      '<section class="type-wall">' +
        '<h2 class="h2">十六型人格一览</h2>' +
        '<p class="sub" style="text-align:center;color:var(--text-3);font-size:14px;margin-bottom:24px;">四大气质群组各有归属</p>' +
        '<div class="wall-grid">' + wallHtml + '</div>' +
      '</section>' +

      /* ---- 操作 ---- */
      '<div class="result-actions">' +
        '<button class="btn" id="btnRetake">重新测试</button>' +
        '<button class="btn btn--ghost" id="btnCopy">复制我的结果</button>' +
      '</div>' +
    '</div>';

  app.innerHTML = html;

  /* ---- 重新测试：清空进度后重新开始 ---- */
  function retake() {
    const ok = window.confirm('确定要重新测试吗？将清空当前作答，从第一题重新开始。');
    if (!ok) return;
    try {
      localStorage.removeItem(KEEP_KEY);
      localStorage.removeItem(SAVE_KEY);
    } catch (e) { /* ignore */ }
    location.href = 'test.html';
  }
  const btnRetake = document.getElementById('btnRetake');
  if (btnRetake) btnRetake.addEventListener('click', retake);
  const navRetake = document.getElementById('navRetake');
  if (navRetake) navRetake.addEventListener('click', function (e) {
    e.preventDefault();
    retake();
  });

  /* ---- 复制 ---- */
  const btnCopy = document.getElementById('btnCopy');
  if (btnCopy) {
    btnCopy.addEventListener('click', function () {
      const txt = '我的 MBTI 结果：' + code + '（' + type.name + ' · ' + group.name + '）' +
        '\n思维 ' + pairs[0].aPct + '% I / ' + pairs[0].bPct + '% E' +
        '｜能量 ' + pairs[1].aPct + '% N / ' + pairs[1].bPct + '% S' +
        '｜天性 ' + pairs[2].aPct + '% T / ' + pairs[2].bPct + '% F' +
        '｜策略 ' + pairs[3].aPct + '% J / ' + pairs[3].bPct + '% P' +
        '｜身份 ' + identityPct + '% A / ' + identRight + '% T';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () {
          flash(btnCopy, '已复制');
        }, function () { fallbackCopy(txt); });
      } else { fallbackCopy(txt); }
    });
  }
  function fallbackCopy(txt) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash(btnCopy, '已复制'); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }
  function flash(el, msg) {
    const old = el.textContent;
    el.textContent = msg;
    setTimeout(function () { el.textContent = old; }, 1600);
  }

  /* ---- 条形图入场动画（渐变进度条）---- */
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        const track = en.target;
        const w = parseInt(track.getAttribute('data-w'), 10);
        const fillL = track.querySelector('.bar-fill--left');
        const fillR = track.querySelector('.bar-fill--right');
        if (fillL) fillL.style.width = w + '%';
        if (fillR) fillR.style.width = (100 - w) + '%';
        io.unobserve(track);
      }
    });
  }, { threshold: 0.25 });
  app.querySelectorAll('.bar-track').forEach(function (t) { io.observe(t); });

  /* 比例卡小条动画 */
  const io2 = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        const f = en.target;
        f.style.width = f.getAttribute('data-w') + '%';
        io2.unobserve(f);
      }
    });
  }, { threshold: 0.25 });
  app.querySelectorAll('.dim-ratio__fill').forEach(function (f) { io2.observe(f); });
})();
</script>
</body>
</html>
